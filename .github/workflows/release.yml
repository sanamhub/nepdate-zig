# One tag releases the source archive. There is no registry: the archive, its
# SHA-256 and the hash a consumer writes into build.zig.zon are the release.
# A manual dispatch runs preflight and CI only; it cannot hash a tag archive that
# does not exist yet, so the archive and release jobs wait for the tag push.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to validate in the dry run, for example v1.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - name: Version, tag and changelog agree
        id: check
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 tools/release_check.py --tag "$TAG" --no-archive
          else
            python3 tools/release_check.py --draft --tag "$TAG" --no-archive
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  ci:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.17.0
        run: source scripts/install-zig.sh
      - name: Every gate
        run: scripts/ci.sh

  archive:
    needs: [preflight, ci]
    # The archive is the tag's tarball, so only a tag push can build and hash it. A dispatch is
    # preflight and CI only, which is what the dry run needs before the tag exists.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Zig 0.17.0
        run: source scripts/install-zig.sh
      - name: Build and hash the source archive
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="nepdate-zig-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="nepdate-zig-${VERSION}/" \
            -o "dist/${name}" HEAD
          (cd dist && sha256sum "$name" > SHA256SUMS)
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          hash="$(zig fetch "$url")"
          printf '%s\n' "$hash" > "dist/nepdate-zig-${VERSION}.hash"
          {
            echo "url=${url}"
            echo "hash=${hash}"
          } > "dist/nepdate-zig-${VERSION}.dependency"
          cat "dist/nepdate-zig-${VERSION}.dependency"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: [preflight, archive]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archive
          path: dist
      - name: Verify the checked archive
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Attest the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create the GitHub release
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::the changelog section for $VERSION is empty"
            exit 1
          fi
          hash="$(cat "dist/nepdate-zig-${VERSION}.hash")"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          {
            echo
            echo "### Install"
            echo
            echo '```'
            echo "zig fetch --save ${url}"
            echo '```'
            echo
            echo "Or pin the archive in \`build.zig.zon\`:"
            echo
            echo '```zig'
            echo ".nepdate = .{"
            echo '    .url = "'"${url}"'",'
            echo '    .hash = "'"${hash}"'",'
            echo "}"
            echo '```'
            echo
            echo "SHA-256: \`$(awk '{print $1}' dist/SHA256SUMS)\`"
            echo
            echo "This release was built from the tag by GitHub Actions and has build provenance."
          } >> "$notes"
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "dist/nepdate-zig-${VERSION}.tar.gz" \
            "dist/SHA256SUMS" \
            "dist/nepdate-zig-${VERSION}.hash" \
            "dist/nepdate-zig-${VERSION}.dependency" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes" \
            "${prerelease[@]}"

  verify-published:
    needs: [preflight, github-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
